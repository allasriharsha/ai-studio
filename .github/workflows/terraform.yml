
name: AI Studio Terraform

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-studio-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

jobs:
  terraform-plan:
    name: Terraform Diagnostics and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify Google Cloud Credentials
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GOOGLE_APPLICATION_CREDENTIALS"

          gcloud auth application-default \
            print-access-token > /dev/null

          echo "Google Cloud authentication successful"
          echo "Project: $TF_VAR_project_id"

      - name: Diagnose Service Usage API
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(gcloud auth application-default print-access-token)

          APIS=(
            compute.googleapis.com
            container.googleapis.com
            artifactregistry.googleapis.com
            aiplatform.googleapis.com
            iam.googleapis.com
            iamcredentials.googleapis.com
          )

          PROJECTS=(
            "${{ vars.GCP_PROJECT_ID }}"
            "65257539851"
          )

          for PROJECT in "${PROJECTS[@]}"; do
            for VERSION in v1 v1beta1; do
              for API in "${APIS[@]}"; do

                echo "--------------------------------"
                echo "Project: $PROJECT"
                echo "API version: $VERSION"
                echo "Service: $API"

                HTTP_CODE=$(curl -sS \
                  -o /dev/null \
                  -w '%{http_code}' \
                  -H "Authorization: Bearer ${TOKEN}" \
                  "https://serviceusage.googleapis.com/${VERSION}/projects/${PROJECT}/services/${API}")

                echo "HTTP Status: $HTTP_CODE"

              done
            done
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=ai-studio/gke"
      - name: Clear Tainted Project Services
        run: |
          terraform untaint 'google_project_service.required["://googleapis.com"]' || true
          terraform untaint 'google_project_service.required["://googleapis.com"]' || true
          terraform untaint 'google_project_service.required["://googleapis.com"]' || true
          terraform untaint 'google_project_service.required["://googleapis.com"]' || true


      - name: Terraform Validate
        run: terraform validate

      - name: Inspect Terraform State
        shell: bash
        run: |
          echo "=== Terraform Resources ==="
          terraform state list

          echo "=== Terraform Providers ==="
          terraform providers

      - name: Inspect API Resource State
        shell: bash
        run: |
          set -euo pipefail

          for API in \
            compute.googleapis.com \
            container.googleapis.com \
            artifactregistry.googleapis.com \
            aiplatform.googleapis.com \
            iam.googleapis.com \
            iamcredentials.googleapis.com
          do

            RESOURCE="google_project_service.required[\"${API}\"]"

            echo "================================"
            echo "Resource: $RESOURCE"

            terraform state show "$RESOURCE"

          done

      - name: Backup Terraform State
        shell: bash
        run: |
          set -euo pipefail

          terraform state pull > terraform-state-backup.json

          echo "Terraform state backup created"

      - name: Upload Terraform State Backup
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-backup
          path: terraform-state-backup.json
          retention-days: 1
          if-no-files-found: error
      - name: 'Check Active GCP Identity'
        run: |
          gcloud auth list
          gcloud config get-value account
          curl -s -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            https://googleapis.com || true
      - name: Check Quota Project Permissions
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(gcloud auth application-default print-access-token)

          echo "Testing Service Usage API with explicit quota project"

          curl -sS \
            -o /dev/null \
            -w 'HTTP Status: %{http_code}\n' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-Goog-User-Project: bluenestsoft" \
            "https://serviceusage.googleapis.com/v1/projects/bluenestsoft/services/compute.googleapis.com"
      - name: Terraform Request Diagnostics
        shell: bash
        run: |
          set +e

          export TF_LOG=DEBUG
          export TF_LOG_PATH=terraform-debug.log

          terraform plan -input=false -parallelism=1 -out=tfplan
          RESULT=$?

          echo "=== REQUEST PATHS ==="
          grep -Ei 'serviceusage|Request:|Sending request' \
            terraform-debug.log \
            | grep -E 'projects/|Request:' \
            | sed -E 's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
            | head -20 || true

          echo "=== FIRST ERROR CONTEXT ==="
          grep -n -m 1 '403 Forbidden' terraform-debug.log \
            | cut -d: -f1 \
            | while read -r LINE; do
                START=$((LINE > 8 ? LINE - 8 : 1))
                sed -n "${START},${LINE}p" terraform-debug.log \
                  | grep -Ei 'serviceusage|GET |POST |403|projects/' \
                  | head -15
              done || true

          exit "$RESULT"
      - name: Test Terraform Credentials
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Credential configuration ==="
          python3 - <<'PY'
          import json, os

          path = os.environ["GOOGLE_APPLICATION_CREDENTIALS"]

          with open(path) as f:
              creds = json.load(f)

          print("Credential type:", creds.get("type"))
          print("Impersonated service account:",
                creds.get("service_account_impersonation_url"))
          PY

          echo "=== Service Usage access ==="
          gcloud services list \
            --enabled \
            --project=bluenestsoft \
            --filter="config.name=compute.googleapis.com"

      - name: Terraform Plan Diagnostics-pre
        shell: bash
        run: |
          set +e
          export GOOGLE_CREDENTIALS="$(cat "$GOOGLE_APPLICATION_CREDENTIALS")"

          terraform plan -input=false -out=tfplan
          export TF_LOG=TRACE
          export TF_LOG_PATH=terraform-debug.log

          terraform plan -input=false -out=tfplan
          RESULT=$?

          echo "=== HTTP REQUEST URLS ==="
          grep -Ei 'GET https://serviceusage.googleapis.com' \
            terraform-debug.log \
            | sort -u || true

          echo "=== HTTP ERRORS ==="
          grep -Ei '403 Forbidden' \
            terraform-debug.log \
            | head -10 || true

          exit "$RESULT"

      - name: Terraform Plan Diagnostics
        shell: bash
        run: |
          set -euo pipefail

          export TF_LOG=DEBUG
          export TF_LOG_PATH=terraform-debug.log

          terraform plan -input=false -out=tfplan || {
            echo "Terraform Plan failed."

            echo "=== Service Usage API errors ==="

            grep -Ei \
              '403|serviceusage.googleapis.com|permission denied' \
              terraform-debug.log \
              | sed -E \
                's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
              | head -40 || true

            exit 1
          }

          terraform show -no-color tfplan > plan.txt


      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            tfplan
            plan.txt
          retention-days: 1
          if-no-files-found: error
