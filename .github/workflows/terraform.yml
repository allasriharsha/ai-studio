
name: AI Studio Terraform

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-studio-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify Google Cloud Credentials
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GOOGLE_APPLICATION_CREDENTIALS"

          gcloud auth application-default \
            print-access-token > /dev/null

          echo "Google Cloud authentication successful"

      - name: Test Service Usage API
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(gcloud auth application-default print-access-token)

          for API in \
            compute.googleapis.com \
            container.googleapis.com \
            artifactregistry.googleapis.com \
            aiplatform.googleapis.com \
            iam.googleapis.com \
            iamcredentials.googleapis.com
          do
            echo "Testing $API"

            curl --fail-with-body -sS \
              -o /dev/null \
              -w "HTTP Status: %{http_code}\n" \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://serviceusage.googleapis.com/v1/projects/65257539851/services/${API}"
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=ai-studio/gke"

      - name: Terraform Validate
        run: terraform validate

      - name: Backup Terraform State
        shell: bash
        run: |
          set -euo pipefail

          terraform state pull > terraform-state-backup.json

          echo "Terraform state backup created"

      - name: Upload Terraform State Backup
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-backup
          path: terraform-state-backup.json
          retention-days: 1
          if-no-files-found: error

      - name: Inspect Terraform State
        run: |
          echo "=== Terraform State ==="
          terraform state list

          echo "=== Terraform Providers ==="
          terraform providers

      - name: Repair Tainted API Resources
        shell: bash
        run: |
          set -euo pipefail

          APIS=(
            "aiplatform.googleapis.com"
            "artifactregistry.googleapis.com"
            "compute.googleapis.com"
            "container.googleapis.com"
          )

          for API in "${APIS[@]}"; do

            RESOURCE="google_project_service.required[\"${API}\"]"

            echo "Checking $RESOURCE"

            if terraform state show "$RESOURCE" | grep -q '# tainted'; then

              echo "Repairing tainted resource: $RESOURCE"

              terraform untaint "$RESOURCE"

            else

              echo "Resource is not tainted: $RESOURCE"

            fi

          done

      - name: Terraform Plan
        shell: bash
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -out=tfplan

          terraform show \
            -no-color tfplan > plan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            tfplan
            plan.txt
          retention-days: 1
          if-no-files-found: error

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=ai-studio/gke"

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Terraform Apply
        run: terraform apply -input=false tfplan

      - name: Show Terraform Outputs
        run: terraform output
