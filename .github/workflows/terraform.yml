
name: AI Studio Terraform

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-studio-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

jobs:
  terraform-plan:
    name: Terraform Diagnostics and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify Google Cloud Credentials
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GOOGLE_APPLICATION_CREDENTIALS"

          gcloud auth application-default \
            print-access-token > /dev/null

          echo "Google Cloud authentication successful"
          echo "Project: $TF_VAR_project_id"

      - name: Diagnose Service Usage API
        shell: bash
        run: |
          set -euo pipefail

          TOKEN=$(gcloud auth application-default print-access-token)

          APIS=(
            compute.googleapis.com
            container.googleapis.com
            artifactregistry.googleapis.com
            aiplatform.googleapis.com
            iam.googleapis.com
            iamcredentials.googleapis.com
          )

          PROJECTS=(
            "${{ vars.GCP_PROJECT_ID }}"
            "65257539851"
          )

          for PROJECT in "${PROJECTS[@]}"; do
            for VERSION in v1 v1beta1; do
              for API in "${APIS[@]}"; do

                echo "--------------------------------"
                echo "Project: $PROJECT"
                echo "API version: $VERSION"
                echo "Service: $API"

                HTTP_CODE=$(curl -sS \
                  -o /dev/null \
                  -w '%{http_code}' \
                  -H "Authorization: Bearer ${TOKEN}" \
                  "https://serviceusage.googleapis.com/${VERSION}/projects/${PROJECT}/services/${API}")

                echo "HTTP Status: $HTTP_CODE"

              done
            done
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=ai-studio/gke"

      - name: Terraform Validate
        run: terraform validate

      - name: Inspect Terraform State
        shell: bash
        run: |
          echo "=== Terraform Resources ==="
          terraform state list

          echo "=== Terraform Providers ==="
          terraform providers

      - name: Inspect API Resource State
        shell: bash
        run: |
          set -euo pipefail

          for API in \
            compute.googleapis.com \
            container.googleapis.com \
            artifactregistry.googleapis.com \
            aiplatform.googleapis.com \
            iam.googleapis.com \
            iamcredentials.googleapis.com
          do

            RESOURCE="google_project_service.required[\"${API}\"]"

            echo "================================"
            echo "Resource: $RESOURCE"

            terraform state show "$RESOURCE"

          done

      - name: Backup Terraform State
        shell: bash
        run: |
          set -euo pipefail

          terraform state pull > terraform-state-backup.json

          echo "Terraform state backup created"

      - name: Upload Terraform State Backup
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-backup
          path: terraform-state-backup.json
          retention-days: 1
          if-no-files-found: error

      - name: Terraform Plan Diagnostics
        shell: bash
        run: |
          set -euo pipefail

          export TF_LOG=DEBUG
          export TF_LOG_PATH=terraform-debug.log

          terraform plan -input=false -out=tfplan || {
            echo "Terraform Plan failed."

            echo "=== Service Usage API errors ==="

            grep -Ei \
              '403|serviceusage.googleapis.com|permission denied' \
              terraform-debug.log \
              | sed -E \
                's/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
              | head -40 || true

            exit 1
          }

          terraform show -no-color tfplan > plan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            tfplan
            plan.txt
          retention-days: 1
          if-no-files-found: error
