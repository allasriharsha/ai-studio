
name: AI Studio Terraform Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-studio-terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

jobs:
  terraform-diagnostics:
    name: Terraform Diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify Credentials
        run: |
          set -euo pipefail

          test -f "$GOOGLE_APPLICATION_CREDENTIALS"

          gcloud auth application-default \
            print-access-token > /dev/null

          echo "Authentication successful"

      - name: Test Service Usage API
        run: |
          set -euo pipefail

          TOKEN=$(gcloud auth application-default print-access-token)

          for API in \
            compute.googleapis.com \
            container.googleapis.com \
            artifactregistry.googleapis.com \
            aiplatform.googleapis.com \
            iam.googleapis.com \
            iamcredentials.googleapis.com
          do
            echo "Testing $API"

            curl -sS \
              -o /dev/null \
              -w "HTTP Status: %{http_code}\n" \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://serviceusage.googleapis.com/v1/projects/65257539851/services/${API}"
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=ai-studio/gke"

      - name: Terraform Validate
        run: terraform validate

      - name: List Terraform State
        run: |
          echo "=== Resources in Terraform State ==="
          terraform state list

      - name: Inspect API State
        run: |
          echo "=== Compute API ==="

          terraform state show \
            'google_project_service.required["compute.googleapis.com"]'

          echo "=== Kubernetes API ==="

          terraform state show \
            'google_project_service.required["container.googleapis.com"]'

          echo "=== Artifact Registry API ==="

          terraform state show \
            'google_project_service.required["artifactregistry.googleapis.com"]'

          echo "=== Vertex AI API ==="

          terraform state show \
            'google_project_service.required["aiplatform.googleapis.com"]'

          echo "=== IAM API ==="

          terraform state show \
            'google_project_service.required["iam.googleapis.com"]'

          echo "=== IAM Credentials API ==="

          terraform state show \
            'google_project_service.required["iamcredentials.googleapis.com"]'

      - name: Inspect Terraform Providers
        run: terraform providers

      - name: Backup Terraform State
        run: |
          terraform state pull > terraform-state-backup.json

          echo "Terraform state backup created"

      - name: Upload State Backup
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-backup
          path: terraform-state-backup.json
          retention-days: 1
          if-no-files-found: error

      - name: Diagnostic Terraform Plan
        run: |
          terraform plan \
            -refresh=false \
            -input=false \
            -out=diagnostic.tfplan

          terraform show \
            -no-color diagnostic.tfplan \
            > diagnostic-plan.txt

      - name: Upload Diagnostic Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-diagnostic-plan
          path: diagnostic-plan.txt
          retention-days: 1
          if-no-files-found: error

      - name: Diagnostics Complete
        run: |
          echo "Diagnostics completed."
          echo "No infrastructure changes have been applied."
          echo "Do not apply a plan generated with refresh disabled."
